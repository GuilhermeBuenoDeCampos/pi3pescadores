<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciar Usuários — PeregrinosTur</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Jost', sans-serif; }
    body { background: #f6f4f0; }

    .transition-fade {
      transition: all 0.3s ease;
    }

    .toast-enter {
      animation: slideInRight 0.4s ease forwards;
    }
    .toast-leave {
      animation: slideOutRight 0.3s ease forwards;
    }

    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to   { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideOutRight {
      from { transform: translateX(0); opacity: 1; }
      to   { transform: translateX(100%); opacity: 0; }
    }

    .form-card-enter {
      animation: fadeDown 0.35s ease;
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .table-row-hover:hover {
      background-color: #edf0f7 !important;
    }

    input.error, select.error {
      border-color: #dc2626 !important;
      box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.15);
    }

    .mask-input:focus {
      outline: none;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 6px; }
    ::-webkit-scrollbar-thumb { background: #c1c7d0; border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #a0a8b5; }
  </style>
</head>
<body>

  <div x-data="crudApp()" class="min-h-screen" style="background: #f6f4f0;">

    <!-- ========== TOAST CONTAINER ========== -->
    <div class="fixed top-5 right-5 z-50 flex flex-col gap-3" style="min-width: 320px;">
      <template x-for="(toast, i) in toasts" :key="i">
        <div x-show="toast.show" x-transition:enter="toast-enter" x-transition:leave="toast-leave"
             class="flex items-start gap-3 px-5 py-4 rounded-xl shadow-lg text-white text-sm font-medium"
             :class="toast.type === 'success' ? 'bg-emerald-600' : toast.type === 'error' ? 'bg-red-600' : 'bg-blue-600'">
          <span x-html="toast.icon" class="mt-0.5 text-lg leading-none"></span>
          <span class="flex-1 leading-snug" x-text="toast.message"></span>
          <button @click="toast.show = false" class="text-white/70 hover:text-white transition ml-2 text-lg leading-none">&times;</button>
        </div>
      </template>
    </div>

    <!-- ========== DELETE CONFIRMATION MODAL ========== -->
    <div x-show="deleteModal.open" x-cloak
         class="fixed inset-0 z-40 flex items-center justify-center bg-black/40 backdrop-blur-sm px-4"
         @click.self="deleteModal.open = false">
      <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md" @click.stop>
        <div class="text-center">
          <div class="mx-auto w-14 h-14 rounded-full bg-red-50 flex items-center justify-center mb-4">
            <svg class="w-7 h-7 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </div>
          <h3 class="text-lg font-semibold text-gray-800 mb-2">Confirmar Exclusão</h3>
          <p class="text-sm text-gray-500 mb-6">
            Tem certeza que deseja excluir o usuário <br/>
            <strong class="text-gray-700" x-text="deleteModal.userName"></strong>?
          </p>
          <div class="flex gap-3 justify-center">
            <button @click="deleteModal.open = false"
                    class="px-5 py-2.5 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 transition text-sm font-medium">
              Cancelar
            </button>
            <button @click="confirmDelete()"
                    class="px-5 py-2.5 rounded-lg bg-red-600 text-white hover:bg-red-700 transition text-sm font-medium shadow-sm">
              Sim, excluir
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== MAIN CONTAINER ========== -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 lg:py-10">

      <!-- ========== HEADER CARD ========== -->
      <header class="bg-white rounded-2xl shadow-[0_18px_42px_rgba(47,58,98,0.08)] flex items-center gap-4 px-6 py-5 mb-6">
        <div class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0" style="background: #f6f4f0;">
          <svg class="w-6 h-6" style="color: #5366aa;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-xl lg:text-2xl font-semibold m-0" style="color: #405394;">Gerenciar Usuários</h1>
          <p class="text-sm m-0 mt-0.5" style="color: #5f6675;">Cadastro e administração de usuários do sistema</p>
        </div>
        <button @click="openNewForm()"
                class="ml-auto hidden sm:inline-flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-semibold text-white shadow-lg transition hover:brightness-110"
                style="background: #5366aa; box-shadow: 0 8px 20px rgba(83,102,170,0.25);">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
          Novo Usuário
        </button>
      </header>

      <!-- ========== FORM CARD ========== -->
      <div x-show="showForm" x-cloak x-transition:enter="form-card-enter"
           class="bg-white rounded-2xl shadow-[0_16px_34px_rgba(47,58,98,0.07)] p-6 mb-6">
        <div class="flex items-center justify-between mb-5">
          <div>
            <h2 class="text-lg font-semibold" style="color: #1e293b;" x-text="editingId ? 'Editar Usuário' : 'Novo Usuário'"></h2>
            <p class="text-xs" style="color: #64748b;" x-text="editingId ? 'Altere os dados do usuário selecionado' : 'Preencha os dados para cadastrar um novo usuário'"></p>
          </div>
          <button @click="showForm = false; resetForm()" class="text-gray-400 hover:text-gray-600 transition text-xl leading-none">&times;</button>
        </div>

        <form @submit.prevent="saveUser()" class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
          <!-- Tipo -->
          <div>
            <label class="block text-sm font-medium mb-1.5" style="color: #1e293b;">Tipo de Usuário <span class="text-red-500">*</span></label>
            <select x-model="form.tipo"
                    :class="{'error': errors.tipo}"
                    class="w-full px-4 py-2.5 rounded-xl border text-sm transition"
                    style="border-color: #e1e7ec; background: #fafafa;">
              <option value="">Selecione o tipo</option>
              <option value="Cliente">Cliente</option>
              <option value="Funcionário">Funcionário</option>
              <option value="Admin">Admin</option>
            </select>
            <p x-show="errors.tipo" class="text-red-500 text-xs mt-1" x-text="errors.tipo"></p>
          </div>

          <!-- Nome -->
          <div>
            <label class="block text-sm font-medium mb-1.5" style="color: #1e293b;">Nome Completo <span class="text-red-500">*</span></label>
            <input type="text" x-model="form.nome"
                   :class="{'error': errors.nome}"
                   class="w-full px-4 py-2.5 rounded-xl border text-sm transition"
                   style="border-color: #e1e7ec; background: #fafafa;"
                   placeholder="Digite o nome completo" />
            <p x-show="errors.nome" class="text-red-500 text-xs mt-1" x-text="errors.nome"></p>
          </div>

          <!-- Email -->
          <div>
            <label class="block text-sm font-medium mb-1.5" style="color: #1e293b;">E-mail <span class="text-red-500">*</span></label>
            <input type="email" x-model="form.email"
                   :class="{'error': errors.email}"
                   class="w-full px-4 py-2.5 rounded-xl border text-sm transition"
                   style="border-color: #e1e7ec; background: #fafafa;"
                   placeholder="email@exemplo.com" />
            <p x-show="errors.email" class="text-red-500 text-xs mt-1" x-text="errors.email"></p>
          </div>

          <!-- Telefone -->
          <div>
            <label class="block text-sm font-medium mb-1.5" style="color: #1e293b;">Telefone <span class="text-red-500">*</span></label>
            <input type="text" x-model="form.telefone"
                   @input="maskTelefone($event)"
                   :class="{'error': errors.telefone}"
                   class="w-full px-4 py-2.5 rounded-xl border text-sm transition"
                   style="border-color: #e1e7ec; background: #fafafa;"
                   placeholder="(00) 00000-0000" maxlength="15" />
            <p x-show="errors.telefone" class="text-red-500 text-xs mt-1" x-text="errors.telefone"></p>
          </div>

          <!-- CPF -->
          <div>
            <label class="block text-sm font-medium mb-1.5" style="color: #1e293b;">CPF <span class="text-red-500">*</span></label>
            <input type="text" x-model="form.cpf"
                   @input="maskCpf($event)"
                   :class="{'error': errors.cpf}"
                   class="w-full px-4 py-2.5 rounded-xl border text-sm transition"
                   style="border-color: #e1e7ec; background: #fafafa;"
                   placeholder="000.000.000-00" maxlength="14" />
            <p x-show="errors.cpf" class="text-red-500 text-xs mt-1" x-text="errors.cpf"></p>
          </div>

          <!-- Ações -->
          <div class="md:col-span-2 flex flex-wrap items-center gap-3 pt-3 border-t mt-2" style="border-color: #f0f2f5;">
            <button type="submit"
                    class="inline-flex items-center gap-2 px-6 py-2.5 rounded-xl text-sm font-semibold text-white shadow-lg transition hover:brightness-110"
                    style="background: #5366aa; box-shadow: 0 6px 16px rgba(83,102,170,0.25);">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
              <span x-text="editingId ? 'Atualizar' : 'Salvar'"></span>
            </button>
            <button type="button" @click="showForm = false; resetForm()"
                    class="px-5 py-2.5 rounded-xl border text-sm font-medium transition"
                    style="border-color: #e1e7ec; color: #64748b; background: #fafafa;">
              Cancelar
            </button>
            <button type="button" @click="resetForm()"
                    class="px-5 py-2.5 rounded-xl border text-sm font-medium transition"
                    style="border-color: #e1e7ec; color: #64748b; background: #fafafa;">
              Limpar
            </button>
          </div>
        </form>
      </div>

      <!-- ========== SELECT + SEARCH BAR ========== -->
      <div class="bg-white rounded-2xl shadow-[0_16px_34px_rgba(47,58,98,0.07)] p-5 mb-6">
        <div class="flex flex-col sm:flex-row items-start sm:items-end gap-4">
          <!-- Select dropdown -->
          <div class="w-full sm:flex-1">
            <label class="block text-xs font-semibold uppercase tracking-wider mb-1.5" style="color: #64748b;">Selecionar Usuário para Editar</label>
            <select x-model="selectedUserId" @change="selectUserForEdit()"
                    class="w-full px-4 py-3 rounded-xl border text-sm transition cursor-pointer"
                    style="border-color: #e1e7ec; background: #fafafa;">
              <option value="">— Selecione um usuário —</option>
              <template x-for="u in users" :key="u.id">
                <option :value="u.id" x-text="`${u.nome} (${u.tipo})`"></option>
              </template>
            </select>
          </div>
          <!-- Search input -->
          <div class="w-full sm:w-64">
            <label class="block text-xs font-semibold uppercase tracking-wider mb-1.5" style="color: #64748b;">Buscar na Tabela</label>
            <div class="relative">
              <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4" style="color: #94a3b8;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              <input type="text" x-model="searchQuery"
                     class="w-full pl-10 pr-4 py-3 rounded-xl border text-sm transition"
                     style="border-color: #e1e7ec; background: #fafafa;"
                     placeholder="Buscar por nome, email, CPF..." />
            </div>
          </div>
        </div>
      </div>

      <!-- ========== TABLE ========== -->
      <div class="bg-white rounded-2xl shadow-[0_16px_34px_rgba(47,58,98,0.07)] overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm" style="border-collapse: separate; border-spacing: 0;">
            <thead>
              <tr style="background: #f8fafc;">
                <th class="text-left px-5 py-3.5 text-xs font-semibold uppercase tracking-wider" style="color: #64748b; border-bottom: 2px solid #e8ecf2;">Tipo</th>
                <th class="text-left px-5 py-3.5 text-xs font-semibold uppercase tracking-wider" style="color: #64748b; border-bottom: 2px solid #e8ecf2;">Nome</th>
                <th class="text-left px-5 py-3.5 text-xs font-semibold uppercase tracking-wider hidden md:table-cell" style="color: #64748b; border-bottom: 2px solid #e8ecf2;">E-mail</th>
                <th class="text-left px-5 py-3.5 text-xs font-semibold uppercase tracking-wider hidden sm:table-cell" style="color: #64748b; border-bottom: 2px solid #e8ecf2;">Telefone</th>
                <th class="text-left px-5 py-3.5 text-xs font-semibold uppercase tracking-wider hidden lg:table-cell" style="color: #64748b; border-bottom: 2px solid #e8ecf2;">CPF</th>
                <th class="text-left px-5 py-3.5 text-xs font-semibold uppercase tracking-wider hidden lg:table-cell" style="color: #64748b; border-bottom: 2px solid #e8ecf2;">Cadastro</th>
                <th class="text-center px-5 py-3.5 text-xs font-semibold uppercase tracking-wider" style="color: #64748b; border-bottom: 2px solid #e8ecf2; width: 100px;">Ações</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(u, idx) in filteredUsers" :key="u.id">
                <tr class="transition-colors duration-150"
                    :class="idx % 2 === 0 ? 'bg-white' : 'bg-gray-50/30'"
                    style="border-bottom: 1px solid #f0f2f5;">
                  <td class="px-5 py-3.5">
                    <span class="inline-block px-2.5 py-1 rounded-lg text-xs font-medium"
                          :style="{
                            background: u.tipo === 'Admin' ? '#eef2ff' : u.tipo === 'Funcionário' ? '#f0fdf4' : '#fefce8',
                            color: u.tipo === 'Admin' ? '#4338ca' : u.tipo === 'Funcionário' ? '#15803d' : '#a16207'
                          }"
                          x-text="u.tipo">
                    </span>
                  </td>
                  <td class="px-5 py-3.5 font-medium" style="color: #1e293b;" x-text="u.nome"></td>
                  <td class="px-5 py-3.5 hidden md:table-cell" style="color: #475569;" x-text="u.email"></td>
                  <td class="px-5 py-3.5 hidden sm:table-cell" style="color: #475569;" x-text="u.telefone"></td>
                  <td class="px-5 py-3.5 hidden lg:table-cell font-mono text-xs" style="color: #64748b;" x-text="u.cpf"></td>
                  <td class="px-5 py-3.5 hidden lg:table-cell text-xs" style="color: #64748b;" x-text="formatDate(u.createdAt)"></td>
                  <td class="px-5 py-3.5">
                    <div class="flex items-center justify-center gap-1.5">
                      <button @click="editUser(u.id)"
                              class="p-2 rounded-lg transition"
                              style="color: #5366aa;"
                              title="Editar usuário">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                      </button>
                      <button @click="askDelete(u)"
                              class="p-2 rounded-lg transition"
                              style="color: #dc2626;"
                              title="Excluir usuário">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                      </button>
                    </div>
                  </td>
                </tr>
              </template>
              <tr x-show="filteredUsers.length === 0">
                <td colspan="7" class="text-center py-14" style="color: #94a3b8;">
                  <svg class="w-12 h-12 mx-auto mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                  <p class="text-sm font-medium" x-text="users.length === 0 ? 'Nenhum usuário cadastrado ainda.' : 'Nenhum resultado encontrado para sua busca.'"></p>
                   <p class="text-xs mt-1" x-text="users.length === 0 ? 'Clique em &quot;Novo Usuário&quot; para começar.' : 'Tente ajustar o termo de busca.'"></p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <!-- Footer with count -->
        <div class="flex items-center justify-between px-5 py-3 border-t" style="border-color: #f0f2f5; background: #fafafa;">
          <span class="text-xs font-medium" style="color: #64748b;">
            Total: <span x-text="filteredUsers.length"></span> usuário<span x-show="filteredUsers.length !== 1">s</span>
          </span>
          <span x-show="searchQuery && filteredUsers.length !== users.length" class="text-xs" style="color: #94a3b8;">
            (filtrado de <span x-text="users.length"></span>)
          </span>
        </div>
      </div>

    </div>
  </div>

  <script>
    function crudApp() {
      return {
        // ---------- STATE ----------
        users: [],
        showForm: false,
        editingId: null,
        form: { tipo: '', nome: '', email: '', telefone: '', cpf: '' },
        errors: {},
        selectedUserId: '',
        searchQuery: '',
        toasts: [],
        deleteModal: { open: false, userId: null, userName: '' },

        // ---------- INIT ----------
        init() {
          this.loadUsers();
        },

        // ---------- LOCALSTORAGE ----------
        loadUsers() {
          try {
            const data = localStorage.getItem('peregrinos_users');
            this.users = data ? JSON.parse(data) : [];
          } catch {
            this.users = [];
          }
        },

        saveUsers() {
          try {
            localStorage.setItem('peregrinos_users', JSON.stringify(this.users));
          } catch (e) {
            console.error('Erro ao salvar no localStorage:', e);
          }
        },

        // ---------- COMPUTED (via getter) ----------
        get filteredUsers() {
          const q = this.searchQuery ? this.searchQuery.toLowerCase().trim() : '';
          if (!q) return this.users;
          return this.users.filter(u =>
            u.nome.toLowerCase().includes(q) ||
            u.email.toLowerCase().includes(q) ||
            u.cpf.includes(q) ||
            u.telefone.includes(q) ||
            u.tipo.toLowerCase().includes(q)
          );
        },

        // ---------- FORM ----------
        openNewForm() {
          this.resetForm();
          this.editingId = null;
          this.selectedUserId = '';
          this.showForm = true;
          setTimeout(() => {
            this.$nextTick(() => {
              const sel = document.querySelector('select[x-model="form.tipo"]');
              if (sel) sel.focus();
            });
          }, 100);
        },

        resetForm() {
          this.form = { tipo: '', nome: '', email: '', telefone: '', cpf: '' };
          this.errors = {};
          this.editingId = null;
          this.selectedUserId = '';
        },

        selectUserForEdit() {
          if (!this.selectedUserId) return;
          this.editUser(Number(this.selectedUserId));
        },

        editUser(id) {
          const u = this.users.find(x => x.id === id);
          if (!u) return;
          this.form = {
            tipo: u.tipo || '',
            nome: u.nome || '',
            email: u.email || '',
            telefone: u.telefone || '',
            cpf: u.cpf || ''
          };
          this.editingId = u.id;
          this.selectedUserId = String(u.id);
          this.errors = {};
          this.showForm = true;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        // ---------- VALIDATION ----------
        validate() {
          const err = {};
          if (!this.form.tipo) err.tipo = 'Selecione o tipo de usuário';
          if (!this.form.nome || this.form.nome.trim().length < 3) err.nome = 'Informe o nome completo (mínimo 3 caracteres)';
          if (!this.form.email) err.email = 'Informe o e-mail';
          else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.form.email)) err.email = 'Formato de e-mail inválido';
          if (!this.form.telefone) err.telefone = 'Informe o telefone';
          else if (this.form.telefone.replace(/\D/g, '').length < 10) err.telefone = 'Telefone incompleto';
          if (!this.form.cpf) err.cpf = 'Informe o CPF';
          else if (!this.validarCpf(this.form.cpf)) err.cpf = 'CPF inválido';
          this.errors = err;
          return Object.keys(err).length === 0;
        },

        validarCpf(cpf) {
          const nums = cpf.replace(/\D/g, '');
          if (nums.length !== 11) return false;
          if (/^(\d)\1{10}$/.test(nums)) return false;
          let sum = 0;
          for (let i = 0; i < 9; i++) sum += parseInt(nums[i]) * (10 - i);
          let rest = (sum * 10) % 11;
          if (rest === 10) rest = 0;
          if (rest !== parseInt(nums[9])) return false;
          sum = 0;
          for (let i = 0; i < 10; i++) sum += parseInt(nums[i]) * (11 - i);
          rest = (sum * 10) % 11;
          if (rest === 10) rest = 0;
          if (rest !== parseInt(nums[10])) return false;
          return true;
        },

        // ---------- SAVE ----------
        saveUser() {
          if (!this.validate()) return;

          const userData = {
            tipo: this.form.tipo,
            nome: this.form.nome.trim(),
            email: this.form.email.trim().toLowerCase(),
            telefone: this.form.telefone,
            cpf: this.form.cpf
          };

          if (this.editingId) {
            // UPDATE
            const idx = this.users.findIndex(x => x.id === this.editingId);
            if (idx === -1) {
              this.showToast('error', 'Usuário não encontrado.');
              return;
            }
            this.users[idx] = { ...this.users[idx], ...userData };
            this.saveUsers();
            this.showToast('success', 'Usuário atualizado com sucesso!');
            this.showForm = false;
            this.resetForm();
          } else {
            // CREATE
            const duplicate = this.users.find(
              x => x.email === userData.email || x.cpf === userData.cpf
            );
            if (duplicate) {
              this.showToast('error', 'Já existe um usuário com este e-mail ou CPF.');
              return;
            }
            const newUser = {
              ...userData,
              id: Date.now(),
              createdAt: new Date().toISOString()
            };
            this.users.unshift(newUser);
            this.saveUsers();
            this.showToast('success', 'Usuário cadastrado com sucesso!');
            this.showForm = false;
            this.resetForm();
          }
        },

        // ---------- DELETE ----------
        askDelete(u) {
          this.deleteModal = { open: true, userId: u.id, userName: u.nome };
        },

        confirmDelete() {
          this.users = this.users.filter(x => x.id !== this.deleteModal.userId);
          this.saveUsers();
          this.deleteModal.open = false;
          this.showToast('success', 'Usuário excluído com sucesso!');
          if (this.editingId === this.deleteModal.userId) {
            this.resetForm();
            this.showForm = false;
          }
          this.deleteModal = { open: false, userId: null, userName: '' };
        },

        // ---------- TOAST ----------
        showToast(type, message) {
          const icons = {
            success: '&#10003;',
            error: '&#10007;',
            info: '&#8505;'
          };
          const toast = {
            type,
            message,
            icon: icons[type] || icons.info,
            show: true
          };
          this.toasts.push(toast);
          setTimeout(() => {
            toast.show = false;
            setTimeout(() => {
              this.toasts = this.toasts.filter(t => t !== toast);
            }, 400);
          }, 3500);
        },

        // ---------- MASKS ----------
        maskTelefone(e) {
          let val = e.target.value.replace(/\D/g, '');
          if (val.length > 11) val = val.slice(0, 11);
          let masked = val;
          if (val.length > 6) {
            masked = `(${val.slice(0, 2)}) ${val.slice(2, 7)}-${val.slice(7)}`;
          } else if (val.length > 2) {
            masked = `(${val.slice(0, 2)}) ${val.slice(2)}`;
          } else if (val.length > 0) {
            masked = `(${val}`;
          }
          this.form.telefone = masked;
        },

        maskCpf(e) {
          let val = e.target.value.replace(/\D/g, '');
          if (val.length > 11) val = val.slice(0, 11);
          let masked = val;
          if (val.length > 9) {
            masked = `${val.slice(0, 3)}.${val.slice(3, 6)}.${val.slice(6, 9)}-${val.slice(9)}`;
          } else if (val.length > 6) {
            masked = `${val.slice(0, 3)}.${val.slice(3, 6)}.${val.slice(6)}`;
          } else if (val.length > 3) {
            masked = `${val.slice(0, 3)}.${val.slice(3)}`;
          }
          this.form.cpf = masked;
        },

        // ---------- HELPERS ----------
        formatDate(iso) {
          if (!iso) return '—';
          const d = new Date(iso);
          return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }
      };
    }
  </script>
